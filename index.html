            },
            {
              "@type": "Question",
              "name": "How does WhatsApp pricing work on Cocoonmail?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Cocoonmail charges official direct Meta conversation rates ($0.01 / ₹0.85 for Marketing messages and $0.0047 / ₹0.40 for Utility, Authentication, and Service messages). Growth plans include 500 messages monthly, Pro plans include 1,000 messages monthly, and all customer inbound messages are 100% free."
              }
            },
            {
              "@type": "Question",
              "name": "Does Cocoonmail support custom email sending domains?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Starter plans include 1 custom sending domain, Growth plans include 3 sending domains, Pro plans include 10 sending domains, and Enterprise plans offer unlimited domains. Additional sending domains can be added for $5/month (₹300/month)."
              }
            },
            {
              "@type": "Question",
              "name": "How does Cocoonmail compare to Klaviyo or Mailchimp?",

                "@type": "Answer",

            }
